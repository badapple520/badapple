on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest   # 直接用最新版 24，彻底解决环境报错
    steps:
      - name: 拉取最新代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 同步上游更新（保留你的图标和密码配置）
        run: |
          git remote add upstream https://github.com/xiaolongbao0709/ai-virtual-phone.git
          git fetch upstream
          # -X ours 是重点：遇到冲突时，强制保留你电脑上修改过的文件（图标、密码等）
          git merge upstream/main --allow-unrelated-histories -X ours -m "同步原作者更新"
          git push origin main
